version: "3.9"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: mcourses
      POSTGRES_PASSWORD: mcourses
      POSTGRES_DB: mcourses
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mcourses"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ACCESS_KEY: minio
      MINIO_SECRET_KEY: minio123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    depends_on:
      - postgres
      - minio
    environment:
      DATABASE_URL: postgresql+psycopg2://mcourses:mcourses@postgres:5432/mcourses
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minio
      MINIO_SECRET_KEY: minio123
      MINIO_BUCKET: documents
      GEMINI_API_KEY: AIzaSyB1neP_ijL7T-XcAciw4JD6BOVvVgqzjVc
    ports:
      - "8000:8000"
    volumes:
      # Mount docs directory to access parsed markdown files from host
      - ../backend/docs:/app/docs
    env_file:
      - ../backend/.env

volumes:
  pgdata:
  minio_data:
